<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bio-Lab Lockdown — Escape Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== shared base reset (used by both roles) ===== */
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0; font-family:'Inter', sans-serif; min-height:100vh; overflow-x:hidden; background:#EEF3F2;}

/* ===== role-select landing screen ===== */
#roleSelect{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px;
  background:#EEF3F2;
  background-image:
    radial-gradient(circle at 15% 10%, rgba(14,158,144,0.06), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(124,92,217,0.05), transparent 45%),
    radial-gradient(rgba(23,36,31,0.045) 1px, transparent 1px);
  background-size:auto, auto, 26px 26px;
}
#roleSelect .rs-card{
  background:#FFFFFF; border:1px solid #D6E2DF; border-radius:24px; padding:clamp(28px,5vw,52px);
  max-width:520px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(23,36,31,0.12);
}
#roleSelect .rs-eyebrow{font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:#0E9E90; margin-bottom:10px;}
#roleSelect h1{font-family:'Space Grotesk', sans-serif; font-size:clamp(26px,4vw,36px); margin:0 0 14px; color:#17241F; line-height:1.15;}
#roleSelect p{color:#5C6E68; font-size:15px; line-height:1.6; margin:0 0 28px;}
#roleSelect .rs-btn{
  display:block; width:100%; border:none; border-radius:14px; padding:18px 22px; margin-bottom:14px;
  font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:17px; cursor:pointer; text-align:left;
  display:flex; align-items:center; gap:14px; transition:transform .12s ease;
}
#roleSelect .rs-btn:active{transform:scale(0.98);}
#roleSelect .rs-btn .rs-icon{font-size:26px; flex:none;}
#roleSelect .rs-btn .rs-label{display:flex; flex-direction:column; align-items:flex-start; gap:2px;}
#roleSelect .rs-btn .rs-sub{font-family:'Inter', sans-serif; font-weight:400; font-size:12.5px; opacity:0.85;}
#roleSelect .rs-btn-student{background:#0E9E90; color:#FFFFFF;}
#roleSelect .rs-btn-teacher{background:#7C5CD9; color:#FFFFFF;}
.role-switch-link{
  position:fixed; bottom:14px; right:16px; z-index:200; font-family:'JetBrains Mono', monospace; font-size:11px;
  color:#5C6E68; background:rgba(255,255,255,0.85); border:1px solid #D6E2DF; padding:5px 12px; border-radius:999px;
  cursor:pointer; text-decoration:none;
}
#storageWarningBanner{
  position:sticky; top:0; z-index:500;
  font-family:'Inter', sans-serif; font-size:13.5px; line-height:1.5;
  padding:12px 44px 12px 16px; position:relative;
}
#storageWarningBanner.swb-warn{background:#FFF4E0; border-bottom:2px solid #C97A12; color:#5A3B08;}
#storageWarningBanner.swb-info{background:#E7F3F1; border-bottom:2px solid #0E9E90; color:#0B4E47;}
#storageWarningBanner b{font-family:'Space Grotesk', sans-serif;}
#storageWarningBanner code{background:rgba(0,0,0,0.08); padding:1px 6px; border-radius:5px; font-family:'JetBrains Mono', monospace; font-size:12px;}
#storageWarningBanner .swb-close{
  position:absolute; top:8px; right:10px; background:none; border:none; font-size:16px; line-height:1; cursor:pointer;
  color:inherit; padding:4px 8px;
}

/* ===== scoped student app styles ===== */
#studentRoot{
  --void:#EEF3F2;
  --panel:#FFFFFF;
  --panel-raised:#FFFFFF;
  --panel-raised2:#E4EEEC;
  --line:#D6E2DF;
  --cyan:#0E9E90;
  --cyan-dim:#8AD6CC;
  --amber:#C97A12;
  --coral:#D94F3D;
  --lime:#3F8F2C;
  --violet:#7C5CD9;
  --paper:#17241F;
  --muted:#5C6E68;
  --cyan-bright:#5FE9DB;
  --radius:18px;
  --disp: 'Space Grotesk', sans-serif;
  --body: 'Inter', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
#studentRoot{
  margin:0; font-family:var(--body); background:var(--void); color:var(--paper);
  background-image:
    radial-gradient(circle at 15% 10%, rgba(14,158,144,0.06), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(124,92,217,0.05), transparent 45%),
    radial-gradient(rgba(23,36,31,0.045) 1px, transparent 1px);
  background-size:auto, auto, 26px 26px;
  min-height:100vh; overflow-x:hidden;
}
#studentRoot h1, #studentRoot h2, #studentRoot h3, #studentRoot .disp{font-family:var(--disp); letter-spacing:0.01em;}
#studentRoot .mono{font-family:var(--mono);}
#studentRoot button{font-family:var(--body); cursor:pointer;}
#studentRoot ::selection{background:var(--cyan); color:var(--void);}
#studentRoot .stage{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px;}
#studentRoot .card{
  background:linear-gradient(180deg, var(--panel-raised), var(--panel));
  border:1px solid var(--line); border-radius:24px;
  padding:clamp(24px,4vw,48px); max-width:760px; width:100%;
  box-shadow:0 20px 50px rgba(23,36,31,0.12);
  position:relative;
}
#studentRoot .slide-tab{
  position:absolute; top:-14px; left:28px; background:var(--cyan); color:var(--void);
  font-family:var(--mono); font-weight:700; font-size:11px; letter-spacing:0.12em;
  padding:5px 14px; border-radius:999px; text-transform:uppercase;
}
#studentRoot .eyebrow{color:var(--cyan); font-family:var(--mono); font-size:12px; letter-spacing:0.16em; text-transform:uppercase; margin-bottom:10px;}
#studentRoot h1.title{font-size:clamp(28px,4.4vw,42px); margin:0 0 14px; line-height:1.1;}
#studentRoot p.lead{color:var(--muted); font-size:clamp(15px,2vw,18px); line-height:1.6; margin:0 0 22px;}
#studentRoot .btn{
  border:none; border-radius:14px; padding:16px 26px; font-weight:700; font-size:17px;
  font-family:var(--disp); transition:transform .12s ease, box-shadow .12s ease; letter-spacing:0.01em;
}
#studentRoot .btn:active{transform:scale(0.97);}
#studentRoot .btn-primary{background:var(--cyan); color:#FFFFFF; box-shadow:0 8px 20px rgba(14,158,144,0.28);}
#studentRoot .btn-primary:hover{box-shadow:0 10px 26px rgba(14,158,144,0.38);}
#studentRoot .btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--line);}
#studentRoot .btn-ghost:hover{color:var(--paper); border-color:var(--cyan-dim);}
#studentRoot .btn-amber{background:var(--amber); color:#FFFFFF;}
#studentRoot .btn-block{width:100%; display:block; text-align:center;}
#studentRoot .btn:disabled{opacity:.4; cursor:not-allowed; box-shadow:none;}
#studentRoot .row{display:flex; gap:12px; flex-wrap:wrap;}
#studentRoot .rules{list-style:none; padding:0; margin:0 0 26px; display:grid; gap:10px;}
#studentRoot .rules li{display:flex; gap:12px; align-items:flex-start; color:var(--paper); font-size:15px; line-height:1.5;}
#studentRoot .rules li .ico{color:var(--cyan); font-family:var(--mono); font-weight:700; flex:none;}
#studentRoot input[type=text]{
  width:100%; background:var(--void); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; color:var(--paper); font-size:16px; font-family:var(--body); margin-bottom:12px;
}
#studentRoot input[type=text]:focus{outline:none; border-color:var(--cyan);}
#studentRoot label.field-label{font-size:12px; color:var(--muted); font-family:var(--mono); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:6px; display:block;}
#studentRoot .divider{height:1px; background:var(--line); margin:22px 0;}
#studentRoot .tiny-link{background:none; border:none; color:var(--muted); font-size:13px; text-decoration:underline; font-family:var(--body);}
#studentRoot .tiny-link:hover{color:var(--cyan);}
#studentRoot #hud{
  position:sticky; top:0; z-index:40; backdrop-filter:blur(10px);
  background:rgba(10,15,28,0.9); border-bottom:1px solid var(--line);
  padding:12px clamp(14px,3vw,32px); display:flex; align-items:center; gap:clamp(10px,2vw,26px);
  flex-wrap:wrap;
}
#studentRoot .hud-block{display:flex; flex-direction:column; gap:3px; min-width:0;}
#studentRoot .hud-label{font-family:var(--mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted);}
#studentRoot .hud-value{font-family:var(--disp); font-weight:700; font-size:clamp(16px,2vw,20px);}
#studentRoot #timer-block{margin-right:auto;}
#studentRoot #timer-digits{
  font-family:var(--mono); font-weight:700; font-size:clamp(24px,3.4vw,32px);
  background:#0B1220; border:1px solid var(--line); border-radius:10px; padding:4px 14px;
  letter-spacing:0.06em; color:var(--cyan-bright); display:inline-block;
  box-shadow:inset 0 0 18px rgba(95,233,219,0.14);
}
#studentRoot #timer-digits.warn-15{color:var(--amber); border-color:var(--amber);}
#studentRoot #timer-digits.warn-10{color:var(--amber); border-color:var(--amber); box-shadow:inset 0 0 18px rgba(245,184,76,0.25);}
#studentRoot #timer-digits.warn-5{color:var(--coral); border-color:var(--coral); animation:pulseSoft 1.4s infinite;}
#studentRoot #timer-digits.warn-1{color:var(--coral); border-color:var(--coral); animation:pulseHard .7s infinite;}
@keyframes pulseSoft{0%,100%{opacity:1;}50%{opacity:.55;}}
@keyframes pulseHard{0%,100%{opacity:1; box-shadow:0 0 0 rgba(255,107,94,0);}50%{opacity:.5; box-shadow:0 0 22px rgba(255,107,94,0.6);}}
#studentRoot .vial{width:min(220px,32vw); height:14px; border-radius:999px; background:var(--panel-raised2); border:1px solid var(--line); overflow:hidden; position:relative;}
#studentRoot .vial-fill{height:100%; background:linear-gradient(90deg, var(--cyan-dim), var(--cyan)); transition:width .5s ease; border-radius:999px;}
#studentRoot .codes-row{display:flex; gap:6px;}
#studentRoot .code-token{
  width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-weight:700; font-size:13px; border:1px solid var(--line); background:var(--panel-raised2); color:var(--muted);
}
#studentRoot .code-token.got{background:var(--lime); color:#FFFFFF; border-color:var(--lime);}
#studentRoot #game-wrap{max-width:920px; margin:0 auto; padding:28px 18px 80px;}
#studentRoot .ch-header{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
#studentRoot .ch-icon{font-size:34px; filter:drop-shadow(0 0 10px rgba(79,227,211,0.5));}
#studentRoot .ch-title{font-size:clamp(20px,3vw,28px); margin:0;}
#studentRoot .ch-sub{color:var(--muted); font-size:13px; font-family:var(--mono); text-transform:uppercase; letter-spacing:0.1em;}
#studentRoot .item-card{
  background:var(--panel-raised); border:1.5px solid var(--line); border-radius:20px; padding:clamp(20px,3vw,32px);
  margin-bottom:18px; position:relative; transition:border-color .2s, opacity .2s;
}
#studentRoot .item-card.solved{border-color:var(--lime); opacity:0.92;}
#studentRoot .item-kicker{font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.12em; margin-bottom:10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
#studentRoot .solved-badge{font-family:var(--body); font-size:11.5px; color:var(--lime); background:rgba(63,143,44,0.12); padding:2px 10px; border-radius:999px; text-transform:none; letter-spacing:normal; font-weight:700;}
#studentRoot #challenge-complete-bar{position:sticky; bottom:16px; z-index:30; margin-top:8px;}
#studentRoot .progress-hint{
  background:var(--panel-raised2); border:1px dashed var(--line); border-radius:14px; padding:16px 20px; text-align:center;
  color:var(--muted); font-size:14px; font-family:var(--mono);
}
#studentRoot .prompt{font-size:clamp(16px,2.2vw,19px); line-height:1.55; margin:0 0 20px; white-space:pre-line;}
#studentRoot .opt-list{display:grid; gap:10px;}
#studentRoot .opt{
  text-align:left; background:var(--void); border:1.5px solid var(--line); border-radius:14px; padding:15px 18px;
  color:var(--paper); font-size:15px; line-height:1.4; transition:border-color .15s, background .15s;
}
#studentRoot .opt:hover{border-color:var(--cyan-dim);}
#studentRoot .opt.selected{border-color:var(--cyan); background:rgba(79,227,211,0.08);}
#studentRoot .opt.correct{border-color:var(--lime); background:rgba(155,229,100,0.12);}
#studentRoot .opt.wrong{border-color:var(--coral); background:rgba(255,107,94,0.12);}
#studentRoot .match-wrap{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
@media(max-width:620px){#studentRoot .match-wrap{grid-template-columns:1fr;}}
#studentRoot .match-col-label{font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; margin-bottom:8px; letter-spacing:0.1em;}
#studentRoot .match-item{
  background:var(--void); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px;
  font-size:14px; line-height:1.4; transition:.15s;
}
#studentRoot .match-item.selected{border-color:var(--cyan); background:rgba(79,227,211,0.08);}
#studentRoot .match-item.paired{border-color:var(--lime); background:rgba(155,229,100,0.1); opacity:.55;}
#studentRoot .match-item.shake{animation:shake .35s;}
@keyframes shake{25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
#studentRoot .order-list{display:grid; gap:8px;}
#studentRoot .order-item{
  background:var(--void); border:1.5px solid var(--line); border-radius:12px; padding:13px 16px;
  display:flex; align-items:center; gap:12px; font-size:14px;
}
#studentRoot .order-num{width:26px; height:26px; border-radius:8px; background:var(--panel-raised2); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:700; font-size:13px; flex:none;}
#studentRoot .order-item.placed .order-num{background:var(--cyan); color:var(--void);}
#studentRoot textarea{
  width:100%; min-height:96px; background:var(--void); border:1.5px solid var(--line); border-radius:12px;
  padding:14px 16px; color:var(--paper); font-family:var(--body); font-size:15px; resize:vertical;
}
#studentRoot textarea:focus{outline:none; border-color:var(--cyan);}
#studentRoot .feedback{margin-top:16px; padding:14px 16px; border-radius:12px; font-size:14.5px; line-height:1.55;}
#studentRoot .feedback.ok{background:rgba(63,143,44,0.1); border:1px solid var(--lime); color:#1E5C13;}
#studentRoot .feedback.bad{background:rgba(217,79,61,0.1); border:1px solid var(--coral); color:#7A2318;}
#studentRoot .hint-box{margin-top:14px; padding:12px 14px; border-radius:12px; background:rgba(201,122,18,0.08); border:1px dashed var(--amber); font-size:13.5px; color:#6B4508;}
#studentRoot .discuss-box{margin-top:16px; padding:16px 18px; border-radius:14px; background:rgba(124,92,217,0.07); border:1px solid rgba(124,92,217,0.3);}
#studentRoot .discuss-title{font-family:var(--disp); font-weight:700; font-size:13.5px; color:var(--violet); margin-bottom:8px;}
#studentRoot .discuss-list{margin:0; padding-left:20px; display:grid; gap:6px;}
#studentRoot .discuss-list li{font-size:14px; line-height:1.5; color:var(--paper);}
#studentRoot .item-actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
#studentRoot .canvas-toolbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
#studentRoot .tool-btn{
  background:var(--void); border:1.5px solid var(--line); color:var(--paper); border-radius:10px; padding:9px 14px; font-size:13px;
}
#studentRoot .tool-btn.active{border-color:var(--cyan); color:var(--cyan);}
#studentRoot #draw-canvas{width:100%; height:min(46vh,420px); background:#FFFFFF; border-radius:14px; border:1.5px dashed var(--line); touch-action:none; display:block; box-shadow:inset 0 0 0 1px rgba(23,36,31,0.02);}
#studentRoot .tube-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px;}
#studentRoot .tube-btn{
  background:var(--void); border:1.5px solid var(--line); border-radius:14px; padding:14px 10px; width:88px; text-align:center; font-size:12px;
}
#studentRoot .tube-btn .tube-glyph{font-size:26px; display:block; margin-bottom:6px;}
#studentRoot .tube-btn.selected{border-color:var(--cyan);}
#studentRoot .result-box{margin-top:14px; padding:14px 16px; border-radius:12px; background:var(--void); border:1px solid var(--line); font-size:14px; min-height:24px;}
#studentRoot .obs-table{width:100%; border-collapse:collapse; margin-top:16px; font-size:13.5px; background:var(--void); border-radius:12px; overflow:hidden; border:1px solid var(--line);}
#studentRoot .obs-table th{background:var(--panel-raised2); text-align:left; padding:10px 12px; font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); border-bottom:1px solid var(--line);}
#studentRoot .obs-table td{padding:10px 12px; border-bottom:1px solid var(--line); color:var(--paper);}
#studentRoot .obs-table tr:last-child td{border-bottom:none;}
#studentRoot .obs-empty{color:var(--muted); font-style:italic; text-align:center; padding:16px 12px;}
#studentRoot .shape-row{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin:6px 0 18px;}
#studentRoot .shape-btn{
  width:78px; height:78px; border-radius:14px; background:var(--void); border:1.5px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:32px;
}
#studentRoot .shape-btn.selected{border-color:var(--cyan);}
#studentRoot .m3d-tabs{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
#studentRoot .m3d-tab{background:var(--void); border:1.5px solid var(--line); border-radius:10px; padding:8px 14px; font-size:12.5px; color:var(--muted); font-family:var(--body);}
#studentRoot .m3d-tab.active{border-color:var(--violet); color:var(--violet); background:rgba(124,92,217,0.08); font-weight:600;}
#studentRoot .m3d-scene{
  position:relative; perspective:700px; overflow:hidden; border-radius:16px; height:230px;
  background:linear-gradient(180deg,#F8FBFA,#ECF3F1); border:1px solid var(--line); cursor:grab; touch-action:none; user-select:none;
}
#studentRoot .m3d-scene:active{cursor:grabbing;}
#studentRoot .m3d-group{position:absolute; left:50%; top:50%; width:0; height:0; transform-style:preserve-3d;}
#studentRoot .m3d-atom{position:absolute; border-radius:50%; box-shadow:0 2px 5px rgba(23,36,31,0.22);}
#studentRoot .m3d-bond{position:absolute; height:5px; border-radius:3px; background:linear-gradient(90deg,#C1CDC9,#9DAFAA); transform-origin:0 50%;}
#studentRoot .m3d-hint{position:absolute; bottom:8px; right:12px; font-family:var(--mono); font-size:10.5px; color:var(--muted); background:rgba(255,255,255,0.75); padding:3px 9px; border-radius:999px; pointer-events:none;}
#studentRoot .m3d-label{position:absolute; top:8px; left:12px; font-family:var(--mono); font-size:11px; color:var(--muted); background:rgba(255,255,255,0.75); padding:3px 9px; border-radius:999px; pointer-events:none;}
#studentRoot .m3d-legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px;}
#studentRoot .m3d-legend span{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted);}
#studentRoot .m3d-legend i{width:10px; height:10px; border-radius:50%; display:inline-block; flex:none;}
#studentRoot .m3d-pin{
  position:absolute; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:rgba(124,92,217,0.15); border:2px dashed var(--violet); color:var(--violet); font-family:var(--mono);
  font-weight:700; font-size:15px; cursor:pointer; pointer-events:auto;
}
#studentRoot .m3d-pin.assigned{border-style:solid; background:rgba(63,143,44,0.18); border-color:var(--lime); color:var(--lime);}
#studentRoot .m3d-pin.wrongflash{border-color:var(--coral); background:rgba(217,79,61,0.2); color:var(--coral); animation:pinShake .3s;}
#studentRoot .m3d-pin-tag{position:absolute; white-space:nowrap; font-size:10.5px; top:-24px; left:50%; transform:translateX(-50%); background:rgba(255,255,255,0.92); padding:2px 8px; border-radius:6px; color:var(--paper); font-family:var(--body); font-weight:700; display:none; box-shadow:0 2px 6px rgba(23,36,31,0.12);}
#studentRoot .m3d-pin.assigned .m3d-pin-tag{display:block;}
@keyframes pinShake{25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
#studentRoot .wordbank{display:flex; gap:10px; flex-wrap:wrap; margin:16px 0;}
#studentRoot .wordbank-item{background:var(--void); border:1.5px solid var(--line); border-radius:999px; padding:10px 18px; font-size:14px; font-weight:600; color:var(--paper);}
#studentRoot .wordbank-item.selected{border-color:var(--violet); background:rgba(124,92,217,0.1); color:var(--violet);}
#studentRoot .wordbank-item.used{opacity:.35; pointer-events:none;}

const FOODTEST_DATA = {

  Y:{name:"Sample Y", iodine:"Stays orange-brown — no colour change.", benedict:"Forms a brick-red precipitate on heating.", biuret:"Stays pale blue — no colour change.", ethanol:"No white emulsion forms."},
  Z:{name:"Sample Z", iodine:"Stays orange-brown — no colour change.", benedict:"Stays blue — no colour change on heating.", biuret:"Turns purple / lilac.", ethanol:"No white emulsion forms."}
};
const SHAPES = [{id:"circle",glyph:"⬤",fits:false},{id:"hex",glyph:"⬡",fits:true},{id:"star",glyph:"★",fits:false}];

/* ============ temperature-vs-enzyme-activity graph (SVG) ============ */
const TEMP_CURVE = [[0,5],[10,15],[20,35],[30,65],[37,95],[40,90],[50,55],[60,15],[70,3],[80,1]];
const TG_XMIN=0, TG_XMAX=80, TG_YMIN=0, TG_YMAX=100;
const TG_X0=55, TG_X1=460, TG_Y0=215, TG_Y1=25;
function tgX(temp){ return TG_X0 + (temp-TG_XMIN)/(TG_XMAX-TG_XMIN)*(TG_X1-TG_X0); }
function tgY(rate){ return TG_Y0 - (rate-TG_YMIN)/(TG_YMAX-TG_YMIN)*(TG_Y0-TG_Y1); }
function tgRateAt(temp){
  for(let i=0;i<TEMP_CURVE.length-1;i++){
    const [t0,r0]=TEMP_CURVE[i], [t1,r1]=TEMP_CURVE[i+1];
    if(temp>=t0 && temp<=t1){ const frac=(temp-t0)/(t1-t0); return r0+(r1-r0)*frac; }
  }
  return TEMP_CURVE[TEMP_CURVE.length-1][1];
}

/* ============ pH graph-PLOTTING engine — blank grid, students tap to place each point ============ */
const PHG_XMIN=0, PHG_XMAX=14, PHG_YMIN=0, PHG_YMAX=100;
const PHG_X0=55, PHG_X1=460, PHG_Y0=215, PHG_Y1=25;
const PHG_VIEWW=500, PHG_VIEWH=260;
function phgX(ph){ return PHG_X0 + (ph-PHG_XMIN)/(PHG_XMAX-PHG_XMIN)*(PHG_X1-PHG_X0); }
function phgY(rate, yMax){ yMax=yMax||PHG_YMAX; return PHG_Y0 - (rate-PHG_YMIN)/(yMax-PHG_YMIN)*(PHG_Y0-PHG_Y1); }
function phgInvX(vx){ return PHG_XMIN + (vx-PHG_X0)/(PHG_X1-PHG_X0)*(PHG_XMAX-PHG_XMIN); }
function phgInvY(vy, yMax){ yMax=yMax||PHG_YMAX; return PHG_YMIN + (PHG_Y0-vy)/(PHG_Y0-PHG_Y1)*(yMax-PHG_YMIN); }
function buildPHGraphSVG(item, st){
  const yMax = st.yScale || PHG_YMAX;
  const placed = st.placed || [];
  const yFracs = [0,0.25,0.5,0.75,1];
  const gridV = yFracs.map(f=>`<line x1="${PHG_X0}" y1="${phgY(f*yMax,yMax)}" x2="${PHG_X1}" y2="${phgY(f*yMax,yMax)}" stroke="#D6E2DF" stroke-width="1"/>`).join("");
  const yLabels = yFracs.map(f=>`<text x="${PHG_X0-10}" y="${phgY(f*yMax,yMax)+4}" font-size="10" fill="#5C6E68" text-anchor="end" font-family="JetBrains Mono, monospace">${Math.round(f*yMax)}</text>`).join("");
  const phTicks = [0,2,4,6,7,8,10,12,14];
  const gridH = phTicks.map(ph=>`<line x1="${phgX(ph)}" y1="${PHG_Y0}" x2="${phgX(ph)}" y2="${PHG_Y1}" stroke="#EDF2F1" stroke-width="1"/>`).join("");
  const xticks = phTicks.map(ph=>`<text x="${phgX(ph)}" y="${PHG_Y0+18}" font-size="10" fill="#5C6E68" text-anchor="middle" font-family="JetBrains Mono, monospace">${ph}</text>`).join("");
  const orderedPlaced = placed.slice().sort((a,b)=>item.dataPoints[a][0]-item.dataPoints[b][0]);
  let lineD="";
  orderedPlaced.forEach((idx,i)=>{ const [ph,rate]=item.dataPoints[idx]; lineD += (i===0?"M":"L")+phgX(ph).toFixed(1)+","+phgY(rate,yMax).toFixed(1)+" "; });
  const line = orderedPlaced.length>1 ? `<path d="${lineD.trim()}" fill="none" stroke="#0E9E90" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>` : "";
  const dots = placed.map(idx=>{ const [ph,rate]=item.dataPoints[idx]; return `<circle cx="${phgX(ph)}" cy="${phgY(rate,yMax)}" r="7" fill="#7C5CD9" stroke="#fff" stroke-width="2"/>`; }).join("");
  let missMarker = "";
  if(st.missFlash) missMarker = `<circle cx="${phgX(st.missFlash.x).toFixed(1)}" cy="${phgY(st.missFlash.y,yMax).toFixed(1)}" r="10" fill="none" stroke="#D94F3D" stroke-width="2.5"/>`;
  return `<svg viewBox="0 0 ${PHG_VIEWW} ${PHG_VIEWH}" class="temp-graph-svg graphplot-svg" id="phgraph-${item.id}" data-item="${item.id}" xmlns="http://www.w3.org/2000/svg">
    ${gridH}${gridV}
    <line x1="${PHG_X0}" y1="${PHG_Y0}" x2="${PHG_X1}" y2="${PHG_Y0}" stroke="#5C6E68" stroke-width="1.5"/>
    <line x1="${PHG_X0}" y1="${PHG_Y0}" x2="${PHG_X0}" y2="${PHG_Y1}" stroke="#5C6E68" stroke-width="1.5"/>
    ${line}${dots}${missMarker}
    ${xticks}${yLabels}
    <text x="${(PHG_X0+PHG_X1)/2}" y="248" font-size="11" fill="#17241F" text-anchor="middle" font-family="Inter, sans-serif">pH</text>
    <text x="14" y="${(PHG_Y0+PHG_Y1)/2}" font-size="11" fill="#17241F" text-anchor="middle" font-family="Inter, sans-serif" transform="rotate(-90 14,${(PHG_Y0+PHG_Y1)/2})">Rate of Reaction</text>
  </svg>`;
}
function handlePHGraphClick(item, st, evt){
  const svg = evt.currentTarget;
  const yMax = st.yScale || PHG_YMAX;
  const rect = svg.getBoundingClientRect();
  const px = evt.clientX - rect.left, py = evt.clientY - rect.top;
  const vx = px/rect.width*PHG_VIEWW, vy = py/rect.height*PHG_VIEWH;
  const dataPh = phgInvX(vx), dataRate = phgInvY(vy, yMax);
  if(!st.placed) st.placed=[];
  let best=null, bestDist=Infinity;
  item.dataPoints.forEach((p,i)=>{
    if(st.placed.includes(i)) return;
    const dx=(dataPh-p[0])/item.tolerance.ph, dy=(dataRate-p[1])/item.tolerance.rate;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if(dist<bestDist){ bestDist=dist; best=i; }
  });
  touchActivity();
  if(best!==null && bestDist<=1){
    st.placed.push(best); st.missFlash=null;
    playTone("ok");
    if(st.placed.length===item.dataPoints.length) markCorrect(item,10);
    rerenderItem(item);
  } else {
    playTone("bad");
    st.missFlash={x:dataPh, y:dataRate};
    rerenderItem(item);
    setTimeout(()=>{ st.missFlash=null; rerenderItem(item); }, 500);
  }
}

/* ============ 3D interactive diagram engine (CSS 3D transforms, drag-to-rotate) ============
   Molecules are laid out as flat rigid structures (all bond math stays simple 2D trig),
   then the whole rigid group is rotated in true 3D via rotateX/rotateY — this keeps every
   bond correctly attached to its atoms at any rotation angle, with no risk of misaligned rods. */
const M3D_COL = { C:"#5C6E68", O:"#D94F3D", N:"#0E9E90", H:"#B7C4C0", R:"#7C5CD9", E:"#7C5CD9", S:"#0E9E90" };

function m3d_ring(cx,cy,colors,radius,puff){
  radius=radius||34; puff=puff===undefined?9:puff;
  const atoms=[],bonds=[];
  for(let i=0;i<6;i++){
    const ang=-Math.PI/2+i*Math.PI/3;
    atoms.push({x:cx+radius*Math.cos(ang), y:cy+radius*Math.sin(ang), z:(i%2===0?puff:-puff), r:14, color:colors[i%colors.length]});
  }
  for(let i=0;i<6;i++) bonds.push([i,(i+1)%6]);
  return {atoms,bonds};
}
function m3d_chain(x0,y0,n,stepX,stepY,zigzag,color,r){
  const len=Math.hypot(stepX,stepY)||1, px=-stepY/len, py=stepX/len;
  const atoms=[],bonds=[];
  for(let i=0;i<n;i++){
    const bx=x0+stepX*i, by=y0+stepY*i, sign=(i%2===0)?1:-1;
    atoms.push({x:bx+px*zigzag*sign, y:by+py*zigzag*sign, z:0, r:r||12, color: typeof color==="function"?color(i):color});
    if(i>0) bonds.push([i-1,i]);
  }
  return {atoms,bonds};
}
function m3d_arc(cx,cy,radius,startDeg,endDeg,n,color,r,puff){
  puff=puff===undefined?9:puff;
  const atoms=[],bonds=[];
  for(let i=0;i<n;i++){
    const t=startDeg+(endDeg-startDeg)*i/(n-1), ang=t*Math.PI/180;
    atoms.push({x:cx+radius*Math.cos(ang), y:cy+radius*Math.sin(ang), z:(i%2===0?puff:-puff), r:r||13, color});
    if(i>0) bonds.push([i-1,i]);
  }
  return {atoms,bonds};
}
function m3d_merge(groups, extraLinks){
  let atoms=[], bonds=[]; const offsets=[];
  groups.forEach(g=>{ offsets.push(atoms.length); atoms=atoms.concat(g.atoms); bonds=bonds.concat(g.bonds.map(([a,b])=>[a+offsets[offsets.length-1], b+offsets[offsets.length-1]])); });
  (extraLinks||[]).forEach(([gi,ai,gj,aj])=>{ bonds.push([offsets[gi]+ai, offsets[gj]+aj]); });
  return {atoms,bonds};
}

function buildSugarModel(){
  const glucose = m3d_ring(-175,0,[M3D_COL.C,M3D_COL.C,M3D_COL.O,M3D_COL.C,M3D_COL.C,M3D_COL.C]);
  const r1=m3d_ring(-25,0,[M3D_COL.C,M3D_COL.C,M3D_COL.O,M3D_COL.C,M3D_COL.C,M3D_COL.C]);
  const r2=m3d_ring(65,0,[M3D_COL.C,M3D_COL.C,M3D_COL.O,M3D_COL.C,M3D_COL.C,M3D_COL.C]);
  const r3=m3d_ring(155,0,[M3D_COL.C,M3D_COL.C,M3D_COL.O,M3D_COL.C,M3D_COL.C,M3D_COL.C]);
  return m3d_merge([glucose,r1,r2,r3], [[1,0,2,3],[2,0,3,3]]);
}
function buildProteinModel(){
  const amino = { atoms:[
      {x:-190,y:0,z:0,r:17,color:M3D_COL.C},
      {x:-238,y:-32,z:0,r:12,color:M3D_COL.N},
      {x:-142,y:-32,z:0,r:12,color:M3D_COL.O},
      {x:-190,y:48,z:0,r:12,color:M3D_COL.R},
      {x:-215,y:32,z:14,r:9,color:M3D_COL.H}
    ], bonds:[[0,1],[0,2],[0,3],[0,4]] };
  const backbone = m3d_chain(-70,0,7,45,0,26,(i)=> i%2===0?M3D_COL.C:M3D_COL.N, 12);
  const stub1={atoms:[{x:backbone.atoms[1].x, y:backbone.atoms[1].y-42, z:0, r:9, color:M3D_COL.R}], bonds:[]};
  const stub2={atoms:[{x:backbone.atoms[3].x, y:backbone.atoms[3].y-42, z:0, r:9, color:M3D_COL.R}], bonds:[]};
  const stub3={atoms:[{x:backbone.atoms[5].x, y:backbone.atoms[5].y-42, z:0, r:9, color:M3D_COL.R}], bonds:[]};
  return m3d_merge([amino,backbone,stub1,stub2,stub3], [[0,0,1,0],[2,0,1,1],[3,0,1,3],[4,0,1,5]]);
}
function buildFatModel(){
  const glycerol={ atoms:[
      {x:-45,y:-85,z:0,r:14,color:M3D_COL.O},
      {x:0,y:-85,z:0,r:14,color:M3D_COL.C},
      {x:45,y:-85,z:0,r:14,color:M3D_COL.O}
    ], bonds:[[0,1],[1,2]] };
  const tail0=m3d_chain(-45,-55,6,0,34,17,M3D_COL.C,11);
  const tail1=m3d_chain(0,-55,6,0,34,17,M3D_COL.C,11);
  const tail2=m3d_chain(45,-55,6,0,34,17,M3D_COL.C,11);
  return m3d_merge([glycerol,tail0,tail1,tail2], [[0,0,1,0],[0,1,2,0],[0,2,3,0]]);
}
function buildEnzymeModel(){
  const enzyme = m3d_arc(0,0,78,45,315,12,M3D_COL.E,15,10);
  const substrate = { atoms:[
      {x:62,y:0,z:14,r:13,color:M3D_COL.S},
      {x:86,y:-16,z:-6,r:11,color:M3D_COL.S},
      {x:86,y:16,z:-6,r:11,color:M3D_COL.S}
    ], bonds:[[0,1],[1,2],[2,0]] };
  return m3d_merge([enzyme,substrate]);
}
const MOLECULE_PRESETS = {
  sugar:{ label:"Glucose → Starch", build:buildSugarModel,
    legend:[["Glucose (single ring)",M3D_COL.C],["Oxygen",M3D_COL.O],["Starch = 3+ glucose rings linked",M3D_COL.C]] },
  protein:{ label:"Amino Acid → Protein", build:buildProteinModel,
    legend:[["Backbone carbon",M3D_COL.C],["Nitrogen (amino)",M3D_COL.N],["Oxygen (carboxyl)",M3D_COL.O],["R group (side chain)",M3D_COL.R]] },
  fat:{ label:"Glycerol + Fatty Acids", build:buildFatModel,
    legend:[["Glycerol backbone",M3D_COL.O],["Fatty acid tail",M3D_COL.C]] }
};

function m3dSceneHTML(id, labelText){
  return `<div class="m3d-scene" id="${id}"><div class="m3d-group" id="${id}-group"></div><div class="m3d-label">${labelText}</div><div class="m3d-hint">🖐 Drag to rotate</div></div>`;

function m3dLegendHTML(legend){

}
let m3dActiveIntervals = [];
function initM3DScene(id, atoms, bonds, opts){
  opts = opts || {};
  const scene=document.getElementById(id), group=document.getElementById(id+"-group");
  if(!scene||!group) return;
  let html="";
  bonds.forEach(([ai,bi])=>{
    const a=atoms[ai], b=atoms[bi];
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy), ang=Math.atan2(dy,dx)*180/Math.PI, midZ=(a.z+b.z)/2;
    html += `<div class="m3d-bond" style="width:${len}px; left:${a.x}px; top:${a.y-2.5}px; transform:translateZ(${midZ}px) rotate(${ang}deg);"></div>`;
  });
  atoms.forEach(at=>{
    html += `<div class="m3d-atom" style="width:${at.r*2}px; height:${at.r*2}px; left:${at.x-at.r}px; top:${at.y-at.r}px; transform:translateZ(${at.z}px); background:radial-gradient(circle at 32% 28%, #ffffff, ${at.color} 55%, ${at.color} 100%);"></div>`;
  });
  (opts.pins||[]).forEach(p=>{
    const assignedLabel = opts.assigned && opts.assigned[p.id];
    const flash = opts.flashPinId===p.id;
    html += `<div class="m3d-pin ${assignedLabel?"assigned":""} ${flash?"wrongflash":""}" data-pinid="${p.id}" style="left:${p.x-17}px; top:${p.y-17}px; transform:translateZ(${p.z}px);">${assignedLabel?"✓":"?"}<span class="m3d-pin-tag">${assignedLabel||""}</span></div>`;
  });
  group.innerHTML = html;
  if(opts.onPinClick){
    group.querySelectorAll(".m3d-pin").forEach(pinEl=>{
      pinEl.onpointerdown = e=>{ e.stopPropagation(); };
      pinEl.onclick = e=>{ e.stopPropagation(); opts.onPinClick(pinEl.dataset.pinid); };
    });
  }
  if(opts.static){
    group.style.transform = "rotateX(-10deg) rotateY(18deg)";
    return;
  }
  let rx=-14, ry=22, dragging=false, lastX=0, lastY=0;
  function apply(){ group.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`; }
  apply();
  const idleId = setInterval(()=>{ if(!dragging){ ry+=0.22; apply(); } }, 30);
  m3dActiveIntervals.push(idleId);
  scene.onpointerdown = e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; try{scene.setPointerCapture(e.pointerId);}catch(err){} };
  scene.onpointermove = e=>{ if(!dragging) return; const dx=e.clientX-lastX, dy=e.clientY-lastY; ry+=dx*0.4; rx=Math.max(-70,Math.min(70,rx-dy*0.4)); lastX=e.clientX; lastY=e.clientY; apply(); };
  scene.onpointerup = ()=>{ dragging=false; };
  scene.onpointerleave = ()=>{ dragging=false; };
}
function buildEnzymeLabelModel(){

function mountAllM3DScenes(){
  m3dActiveIntervals.forEach(id=>clearInterval(id));

  document.querySelectorAll("[data-m3d-preset]").forEach(el=>{

      initM3DScene("m3d-label", m.atoms, m.bonds, {
        pins:m.pins, assigned:st.assign||{}, flashPinId:st.flashPin, static:true,

function handleLabelPinClick(item, st, pinId, pins){
  if(!st.selectedWord) return;
  if(st.assign && st.assign[pinId]) return;
  const pin = pins.find(p=>p.id===pinId);
  st.attempts=(st.attempts||0)+1;
  if(pin.correctLabel===st.selectedWord){
    if(!st.assign) st.assign={};
    st.assign[pinId]=st.selectedWord; st.selectedWord=null; st.flashPin=null;
    touchActivity(); playTone("ok"); rerenderItem(item);
  } else {
    playTone("bad");
    st.flashPin=pinId; touchActivity(); rerenderItem(item);
    setTimeout(()=>{ st.flashPin=null; rerenderItem(item); }, 350);
  }
}

/* ============ audio cues (Web Audio API — no external files needed) ============ */
let audioCtx=null;
function getAudioCtx(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(audioCtx.state==="suspended"){ audioCtx.resume().catch(()=>{}); }
  return audioCtx;
}
function playTone(kind){
  const ctx = getAudioCtx(); if(!ctx) return;
  const now = ctx.currentTime;
  function tone(freq, start, dur, type, peak){
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type=type||"sine"; osc.frequency.value=freq;
    gain.gain.setValueAtTime(0, now+start);
    gain.gain.linearRampToValueAtTime(peak||0.1, now+start+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now+start+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now+start); osc.stop(now+start+dur+0.03);
  }
  if(kind==="ok"){ tone(880,0,0.12,"sine",0.09); tone(1180,0.08,0.14,"sine",0.08); }
  else if(kind==="bad"){ tone(180,0,0.18,"sawtooth",0.07); }
  else if(kind==="hint"){ tone(520,0,0.08,"sine",0.05); }
  else if(kind==="unlock"){ tone(660,0,0.1,"sine",0.09); tone(880,0.1,0.1,"sine",0.09); tone(1180,0.2,0.2,"sine",0.1); }
  else if(kind==="escape"){ tone(660,0,0.1,"triangle",0.09); tone(880,0.1,0.1,"triangle",0.09); tone(1100,0.2,0.1,"triangle",0.09); tone(1320,0.3,0.24,"triangle",0.11); }
  else if(kind==="attention"){ tone(440,0,0.16,"square",0.09); tone(440,0.28,0.16,"square",0.09); tone(440,0.56,0.16,"square",0.09); }
}

/* ============ confetti burst — visual "wow" for challenge unlocks & final escape ============ */
const CONFETTI_COLORS = ["#0E9E90","#C97A12","#D94F3D","#3F8F2C","#7C5CD9","#5FE9DB"];
function spawnConfetti(count){
  const layer = document.getElementById("confetti-layer");
  if(!layer) return;
  count = count || 36;
  for(let i=0;i<count;i++){
    const el = document.createElement("div");
    el.className = "confetti-piece";
    const x = Math.random()*100;
    const drift = (Math.random()*2-1)*80;
    const rot = Math.random()*720-360;
    const dur = 1.1 + Math.random()*0.9;
    const delay = Math.random()*0.25;
    const color = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    const shape = Math.random()<0.5 ? "50%" : "3px";
    el.style.cssText = `left:${x}%; background:${color}; border-radius:${shape}; animation-duration:${dur}s; animation-delay:${delay}s; --drift:${drift}px; --rot:${rot}deg;`;
    layer.appendChild(el);
    setTimeout(()=>el.remove(), (dur+delay)*1000+200);
  }
}

function slug(s){return (s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"")||"team";}

/* ---------------- storage helpers ---------------- */
async function saveState(){
  if(S.offline || !S.sessionCode) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{
    const curCh = CHALLENGES[S.chIndex];
    const curChDone = curCh ? curCh.items.filter(it=>getIS(it.id).done).length : 0;
    const completedItems = CHALLENGES.slice(0,S.chIndex).reduce((s,c)=>s+c.items.length,0) + curChDone;
    const payload = {
      teamName:S.teamName, students:S.students, chIndex:S.chIndex, itemIndex:curChDone,
      totalItems:TOTAL_ITEMS, completedItems, progressPercent:Math.round(completedItems/TOTAL_ITEMS*100),
      currentChallengeTitle: curCh ? curCh.title : "Escaped",
      score:S.score, hintsUsed:S.hintsUsed, codes:S.codes,
      startedAt:S.startedAt, lastActivity:Date.now(), finished:S.finished, finishedAt:S.finishedAt,
      log:S.log.slice(-40)
    };
    try{ await SYNC.set(`er:${S.sessionCode}:team:${S.teamSlug}`, JSON.stringify(payload)); }catch(e){ console.warn("save failed",e); }
  }, 250);
}
async function touchActivity(){
  S.lastActivity=Date.now();
}
let lastAttentionActive = false;
async function pollMeta(){
  if(S.offline || !S.sessionCode) return;
  try{
    const r = await SYNC.get(`er:${S.sessionCode}:meta`);
    if(r && r.value){
      const m = JSON.parse(r.value);
      S.meta = m;
    }
  }catch(e){ /* not created yet */ }
  try{
    const a = await SYNC.get(`er:${S.sessionCode}:attention`);
    if(a && a.value){
      const parsed = JSON.parse(a.value);
      renderAttentionOverlay(!!parsed.active, parsed.message);
    } else {
      renderAttentionOverlay(false);
    }
  }catch(e){ renderAttentionOverlay(false); }
  renderHUD();
}
function renderAttentionOverlay(active, message){
  let el = document.getElementById("attention-overlay");
  if(active){
    if(!lastAttentionActive) playTone("attention");
    if(!el){
      el = document.createElement("div");
      el.id = "attention-overlay";
      el.className = "attention-overlay";
      document.body.appendChild(el);
    }
    el.innerHTML = `<div class="attention-content"><div class="attention-icon">🔔</div><div class="attention-text">Please give your attention to<br><span>${message||"your teacher"}</span></div></div>`;
  } else if(el){
    el.remove();
  }
  lastAttentionActive = active;
}

/* ---------------- item engine ---------------- */
function getIS(id){ if(!S.itemState[id]) S.itemState[id]={attempts:0, hintUsed:false, hintOpen:false, done:false, selected:null, pairs:{}, order:[], text:"", canvasReady:false, tube:null, test:null, results:{}, shapePicked:null, keyEntered:[]}; return S.itemState[id]; }

function pointsFor(base){ return base; }

function markCorrect(item, base=10){
  const st=getIS(item.id);
  if(st.done) return;
  st.done=true;
  let pts=base - (st.hintUsed?3:0) - Math.max(0,st.attempts-1)*2;
  pts=Math.max(2,pts);
  S.score+=pts;
  S.log.push({id:item.id, type:item.type, correct:true, attempts:st.attempts+1, hint:st.hintUsed, ts:Date.now()});
  playTone("ok");
  touchActivity(); saveState();
}
function useHint(item){
  const st=getIS(item.id);
  st.hintOpen=true;
  if(!st.hintUsed){ st.hintUsed=true; S.hintsUsed++; }
  playTone("hint");
  touchActivity(); saveState(); rerenderItem(item);
}
function continueAfterUnlock(){
  S.chIndex++; S.itemIndex=0;
  if(S.chIndex>=CHALLENGES.length){
    S.finished=true; S.finishedAt=Date.now(); S.screen="escaped"; playTone("escape");
    saveState(); render(); return;
  }
  const nextCh = CHALLENGES[S.chIndex];
  S.phase = nextCh.recall ? "recall" : "items";
  saveState(); render();
}
function rerenderItem(item){
  const slot = document.getElementById("item-slot-"+item.id);
  if(slot) slot.innerHTML = renderItem(item);
  bindEvents();
  updateChallengeCompleteBar();
  saveState();
}

function renderItem(item){
  const st=getIS(item.id);
  const hintBtn = (item.hint && !st.done) ? `<button class="btn btn-ghost" data-hint="${item.id}">💡 Use a hint</button>` : "";
  const hintBox = st.hintOpen ? `<div class="hint-box">💡 ${item.hint}</div>` : "";
  if(item.type==="mcq") return itemMCQ(item, st, hintBtn, hintBox);
  if(item.type==="matching") return itemMatching(item, st, hintBtn, hintBox);
  if(item.type==="order") return itemOrder(item, st, hintBtn, hintBox);
  if(item.type==="shortanswer") return itemShortAnswer(item, st, hintBtn, hintBox);
  if(item.type==="canvas") return itemCanvas(item, st);
  if(item.type==="foodtest") return itemFoodTest(item, st);
  if(item.type==="enzymefit") return itemEnzymeFit(item, st);
  if(item.type==="labeldiagram") return itemLabelDiagram(item, st, hintBtn, hintBox);
  if(item.type==="graphread") return itemGraphRead(item, st, hintBtn, hintBox);
  if(item.type==="graphplot") return itemGraphPlot(item, st, hintBtn, hintBox);
  if(item.type==="annotate") return itemAnnotate(item, st);
  if(item.type==="finallock") return itemFinalLock(item, st);
  return "";
}

function itemMCQ(item, st, hintBtn, hintBox){
  const opts = item.options.map((o,i)=>{
    let cls="opt";
    if(st.done){ if(i===item.correct) cls+=" correct"; else if(i===st.selected) cls+=" wrong"; }
    else if(i===st.selected) cls+=" selected";
    return `<button class="${cls}" data-mcq="${item.id}" data-i="${i}" ${st.done?"disabled":""}>${String.fromCharCode(65+i)}.  ${o}</button>`;
  }).join("");
  const fb = st.done ? `<div class="feedback ok">✅ ${item.fbCorrect}</div>` :
    (st.selected!==null && st.wrongFlash ? `<div class="feedback bad"><span class="access-denied">⚠ Access Denied</span>${item.fbWrong}</div>` : "");
  return `<div class="item-card ${st.done?"solved":""}">
    <div class="item-kicker">Multiple choice ${st.done?'<span class="solved-badge">✅ Solved</span>':""}</div>
    <p class="prompt">${item.prompt}</p>
    <div class="opt-list">${opts}</div>
    ${fb}${!st.done?hintBox:""}
    <div class="item-actions">
      ${!st.done ? `<button class="btn btn-primary" data-check="${item.id}" ${st.selected===null?"disabled":""}>Check Answer</button>` : ""}
      ${!st.done?hintBtn:""}
    </div></div>`;
}
function itemMatching(item, st, hintBtn, hintBox){
  const left = item.left.map((l,i)=>`<div class="match-item ${st.selectedLeft===i?"selected":""} ${st.pairs[i]!==undefined?"paired":""}" data-mleft="${i}" data-item="${item.id}">${l}</div>`).join("");
  const right = item.right.map((r,i)=>`<div class="match-item ${Object.values(st.pairs).includes(i)?"paired":""}" data-mright="${i}" data-item="${item.id}">${r}</div>`).join("");
  return `<div class="item-card ${st.done?"solved":""}">
    <div class="item-kicker">Match the pairs — tap one on each side ${st.done?'<span class="solved-badge">✅ Solved</span>':""}</div>
    <p class="prompt">${item.prompt}</p>

/* ---------------- canvas drawing ---------------- */
let cvCtx=null, cvDrawing=false, cvTool="pen", cvStrokes=[], cvCurrent=null, cvBoundCanvas=null;
function initCanvas(){
  const c = document.getElementById("draw-canvas");
  if(!c) return;
  cvBoundCanvas = c;
  const dpr = window.devicePixelRatio||1;
  const rect = c.getBoundingClientRect();
  c.width = rect.width*dpr; c.height = rect.height*dpr;
  cvCtx = c.getContext("2d"); cvCtx.scale(dpr,dpr);
  cvCtx.lineCap="round"; cvCtx.lineJoin="round";
  redrawCanvas();
  const pos = e=>{ const r=c.getBoundingClientRect(); const p = e.touches?e.touches[0]:e; return [p.clientX-r.left, p.clientY-r.top]; };
  c.onpointerdown = e=>{ cvDrawing=true; const [x,y]=pos(e);
    if(cvTool==="text"){ const t=prompt("Label text:"); if(t){ cvStrokes.push({type:"text", x,y,t}); redrawCanvas(); } cvDrawing=false; return; }
    cvCurrent={type:"path", tool:cvTool, pts:[[x,y]]}; cvStrokes.push(cvCurrent); };
  c.onpointermove = e=>{ if(!cvDrawing||!cvCurrent) return; const [x,y]=pos(e); cvCurrent.pts.push([x,y]); redrawCanvas(); };
  c.onpointerup = ()=>{ cvDrawing=false; cvCurrent=null; touchActivity(); };
  c.onpointerleave = ()=>{ cvDrawing=false; cvCurrent=null; };
}
function redrawCanvas(){
  if(!cvCtx) return;
  const c=document.getElementById("draw-canvas"); if(!c) return;
  const dpr=window.devicePixelRatio||1;
  cvCtx.clearRect(0,0,c.width/dpr,c.height/dpr);
  cvStrokes.forEach(s=>{
    if(s.type==="text"){ cvCtx.fillStyle="#17241F"; cvCtx.font="16px Inter, sans-serif"; cvCtx.fillText(s.t, s.x, s.y); return; }
    cvCtx.strokeStyle = s.tool==="eraser" ? "#FFFFFF" : "#0E9E90";
    cvCtx.lineWidth = s.tool==="eraser" ? 22 : 3;
    cvCtx.beginPath();
    s.pts.forEach((p,i)=> i===0?cvCtx.moveTo(p[0],p[1]):cvCtx.lineTo(p[0],p[1]));
    cvCtx.stroke();
  });
}

  // canvas

    b.onclick=()=>{ cvTool=b.dataset.tool; document.querySelectorAll("[data-tool]").forEach(x=>x.classList.remove("active")); b.classList.add("active"); };
  });
  const cvUndo=document.querySelector("[data-cvundo]"); if(cvUndo) cvUndo.onclick=()=>{ cvStrokes.pop(); redrawCanvas(); };
  const cvClear=document.querySelector("[data-cvclear]"); if(cvClear) cvClear.onclick=()=>{ cvStrokes=[]; redrawCanvas(); };
  document.querySelectorAll("[data-annotateready]").forEach(b=>{
    b.onclick=()=>{
      const item=findItem(b.dataset.annotateready); if(!item) return;
      const st=getIS(item.id); st.done=true;
      touchActivity(); rerenderItem(item);
    };
  });
  const recallReady=document.querySelector("[data-recallready]");
  if(recallReady) recallReady.onclick=()=>{ S.phase="items"; S.itemIndex=0; touchActivity(); render(); saveState(); };
  const continueCh=document.getElementById("btn-continue-ch");
  if(continueCh) continueCh.onclick=()=>{ continueAfterUnlock(); };
  const unlockBtn=document.getElementById("btn-unlock-chamber");
  if(unlockBtn) unlockBtn.onclick=()=>{ finishChallenge(); };
  const dc = document.getElementById("draw-canvas");
  if(dc && dc!==cvBoundCanvas){ cvStrokes=[]; setTimeout(initCanvas,20); }
  else if(!dc){ cvBoundCanvas=null; }
  if(document.querySelector(".m3d-scene")){ setTimeout(mountAllM3DScenes,20); }
  document.querySelectorAll("[data-m3dtab]").forEach(b=>{
    b.onclick=()=>{ recallM3DPreset=b.dataset.m3dtab; touchActivity(); render(); };
  });
  document.querySelectorAll("[data-labelword]").forEach(b=>{
    b.onclick=()=>{ const item=findItem(b.dataset.item); const st=getIS(item.id); st.selectedWord=b.dataset.labelword; touchActivity(); rerenderItem(item); };
  });

  // food test
  const testLabels = {iodine:"Iodine", benedict:"Benedict's", biuret:"Biuret", ethanol:"Ethanol emulsion"};
  document.querySelectorAll("[data-tube]").forEach(b=>{ b.onclick=()=>{ const item=findItem(b.dataset.item); const st=getIS(item.id); st.tube=b.dataset.tube; rerenderItem(item); }; });
  document.querySelectorAll("[data-test]").forEach(b=>{ b.onclick=()=>{ const item=findItem(b.dataset.item); const st=getIS(item.id); st.test=b.dataset.test; rerenderItem(item); }; });
  document.querySelectorAll("[data-runtest]").forEach(b=>{
    b.onclick=()=>{
      const item=findItem(b.dataset.runtest); const st=getIS(item.id);
      const notesEl = document.getElementById("ta-"+item.id+"-notes");
      if(notesEl) st.notes = notesEl.value;
      const res = FOODTEST_DATA[st.tube][st.test];
      st.results[st.tube+st.test]=res;
      if(!st.rows) st.rows=[];
      st.rows.push({sample:FOODTEST_DATA[st.tube].name, test:testLabels[st.test], obs:res});
      touchActivity(); rerenderItem(item);
    };
  });
  document.querySelectorAll("textarea[id$='-notes']").forEach(ta=>{
    ta.onblur=()=>{
      const itemId = ta.id.replace(/^ta-/,"").replace(/-notes$/,"");
      const item=findItem(itemId); if(!item) return;
      const st=getIS(item.id); st.notes=ta.value; touchActivity(); saveState();
    };
  });

  // enzyme fit (legacy, unused by current content — kept safe if ever re-enabled)
  document.querySelectorAll("[data-shape]").forEach(b=>{
    b.onclick=()=>{ const item=findItem(b.dataset.item); if(!item) return; const st=getIS(item.id); st.shapePicked=b.dataset.shape; touchActivity(); rerenderItem(item); };
  });

  // final lock
  document.querySelectorAll("[data-digit]").forEach(b=>{
    b.onclick=()=>{ const item=findItem(b.dataset.item); const st=getIS(item.id); if(!st.keyEntered) st.keyEntered=[]; st.keyEntered.push(b.dataset.digit); touchActivity(); rerenderItem(item); };
  });
  document.querySelectorAll("[data-keyreset]").forEach(b=>{
    b.onclick=()=>{ const item=findItem(b.dataset.keyreset); const st=getIS(item.id); st.keyEntered=[]; rerenderItem(item); };
  });
}
function findItem(id){ for(const c of CHALLENGES) for(const it of c.items) if(it.id===id) return it; }
function currentItem(){ return CHALLENGES[S.chIndex].items[S.itemIndex]; }

/* ---------------- timers ---------------- */
function startPolling(){ clearInterval(pollTimer); pollTimer=setInterval(pollMeta, 4000); pollMeta(); }
function startTicker(){ clearInterval(tickTimer); tickTimer=setInterval(()=>{ if(S.screen==="game") renderHUD(); }, 1000); }
window.__initStudentApp = function(){ render(); };

})();
</script>

/* ---------------- status logic ---------------- */
function expectedPercentAtElapsedMin(min){
  // maps elapsed minutes since lesson start to expected cumulative % progress using PACING (skip setup phase)
  const chPacing = PACING.slice(1); // challenges only
  let acc=0;
  for(let i=0;i<chPacing.length;i++){
    const seg=chPacing[i];
    const segItems = CH_ITEM_COUNTS[i];
    if(min<=seg.from) return Math.round(acc/TOTAL_ITEMS*100);
    if(min>=seg.to){ acc+=segItems; continue; }
    const frac=(min-seg.from)/(seg.to-seg.from);
    return Math.round((acc+segItems*frac)/TOTAL_ITEMS*100);
  }
  return 100;
}
function teamStatus(t){
  if(!t) return "notstarted";
  if(t.finished) return "finished";
  if(!S.meta.sessionStart) return t.progressPercent>0 ? "ontrack" : "notstarted";
  const elapsedMin = (Date.now()-S.meta.sessionStart)/60000;
  const stuckMin = (Date.now()-(t.lastActivity||0))/60000;
  if(t.progressPercent===0 && elapsedMin<4) return "notstarted";
  if(stuckMin>=5) return "stuck";
  const expected = expectedPercentAtElapsedMin(elapsedMin);
  if(t.progressPercent < expected-15) return "behind";
  return "ontrack";
}
function statusLabel(s){ return {ontrack:"On track", behind:"Falling behind", stuck:"Stuck", finished:"Finished", notstarted:"Not started"}[s]; }

function bindTopLevel(){
  const byId=(id)=>document.getElementById(id);
  if(byId("in-setcode") && !S.sessionCode) byId("in-setcode").value = randCode();
  if(byId("btn-regen")) byId("btn-regen").onclick=()=>{ byId("in-setcode").value = randCode(); };

  if(byId("btn-create")) byId("btn-create").onclick=()=>{
    let code = byId("in-setcode").value.trim().toUpperCase() || randCode();

    e.preventDefault();
    alert("Getting a free Firebase database URL (about 2 minutes):\n\n1. Go to console.firebase.google.com and create a project (free, no credit card).\n2. In the project, go to Build → Realtime Database → Create Database.\n3. Choose \"Start in test mode\".\n4. Copy the URL shown (looks like https://your-project-default-rtdb.firebaseio.com).\n5. Paste it into the field above and click Create Session.\n\nThat's it — the join link you share afterwards carries this automatically, so students don't need to enter anything.");
  };
  if(byId("btn-demo")) byId("btn-demo").onclick=()=>{ launchDemo(); };
  if(byId("btn-startlesson")) byId("btn-startlesson").onclick=()=>{ startLesson(); };

      navigator.clipboard.writeText(field.value).then(()=>{
        const btn = byId("btn-copy-join-link");
        const original = btn.textContent;
        btn.textContent = "✅ Copied!";
        setTimeout(()=>{ btn.textContent = original; }, 1500);
      });
    }catch(e){ document.execCommand("copy"); }
  };
  document.querySelectorAll(".tab-btn").forEach(b=>{ b.onclick=()=>{ S.activeTab=b.dataset.tab; render(); }; });
}

/* ---------------- topbar live values ---------------- */
function updateTopbar(){
  const clockEl=document.getElementById("tb-clock");
  if(!clockEl) return;
  let cls="";
  if(S.meta.sessionStart){
    const remain = Math.max(0, Math.round(LESSON_SECONDS-(Date.now()-S.meta.sessionStart)/1000));
    if(remain<=60) cls="warn-1"; else if(remain<=300) cls="warn-5"; else if(remain<=600) cls="warn-10"; else if(remain<=900) cls="warn-15";
    clockEl.textContent = `${String(Math.floor(remain/60)).padStart(2,"0")}:${String(remain%60).padStart(2,"0")}`;
  } else clockEl.textContent = "--:--";
  clockEl.className = "mono "+cls;

  const teamsArr = getTeamsArray();
  const progEl=document.getElementById("tb-progress");
  if(progEl){
    if(teamsArr.length===0) progEl.textContent="No teams yet";
    else{
      const avg = Math.round(teamsArr.reduce((s,t)=>s+(t.progressPercent||0),0)/teamsArr.length);
      progEl.textContent = avg+"% avg";
    }
  }
  const pacingWrap=document.getElementById("tb-pacing");
  if(pacingWrap){
    if(S.meta.sessionStart && teamsArr.length>0){
      const elapsedMin=(Date.now()-S.meta.sessionStart)/60000;
      const expected = expectedPercentAtElapsedMin(elapsedMin);
      const avg = Math.round(teamsArr.reduce((s,t)=>s+(t.progressPercent||0),0)/teamsArr.length);
      const behind = avg < expected-12;
      pacingWrap.innerHTML = `<span class="pacing-banner ${behind?'pacing-behind':'pacing-ontrack'}">${behind?"⚠ Class behind pace":"✓ On pace"}</span>`;
    } else pacingWrap.innerHTML="";
  }
}

function getTeamsArray(){
  if(S.demo) return S.demoTeams;
  return Object.values(S.teams);
}

/* ---------------- wall body per tab ---------------- */
function renderWallBody(){
  const wall=document.getElementById("wall");
  if(!wall) return;
  if(S.activeTab==="wall") wall.innerHTML = wallOverview();
  else if(S.activeTab==="pacing") wall.innerHTML = wallPacing();
  else if(S.activeTab==="key") wall.innerHTML = wallAnswerKey();
  else if(S.activeTab==="analytics") wall.innerHTML = wallAnalytics();
  bindWallEvents();
}

function wallOverview(){
  const teams = getTeamsArray();
  if(teams.length===0){
    return `<div class="empty-wall"><div class="big">🧫</div><h3>Waiting for teams to join…</h3>
      <p>Share the session code <b class="mono" style="color:var(--cyan)">${S.sessionCode||"DEMO"}</b> with your class. Cards will appear here as soon as teams register.</p></div>`;
  }
  const cards = teams.map((t,idx)=>{
    const status = teamStatus(t);
    const ch = Math.min(t.chIndex, CH_NAMES.length-1);
    const stuckMin = t.lastActivity ? Math.round((Date.now()-t.lastActivity)/60000) : 0;
    return `<div class="team-card halo-${status}" data-teamidx="${idx}">
      <div class="status-pill pill-${status}">${statusLabel(status)}</div>
      <div class="team-name">${t.teamName || "Unnamed Team"}</div>
      <div class="team-students">${(t.students||[]).filter(Boolean).join(", ")||"—"}</div>
      <div class="team-challenge"><span class="team-ch-icon">${t.finished?"🚪":CH_ICONS[ch]}</span><span class="team-ch-text">${t.finished?"Escaped!":(t.currentChallengeTitle||CH_NAMES[ch])}</span></div>
      <div class="progress-ring-wrap">
        <div class="progress-track"><div class="progress-fill" style="width:${t.progressPercent||0}%"></div></div>
        <div class="progress-pct">${t.progressPercent||0}%</div>
      </div>
      <div class="team-meta-row">
        <div>Score<br><b>${t.score||0}</b></div>
        <div>Hints<br><b>${t.hintsUsed||0}</b></div>
        <div>Codes<br><b>${(t.codes||[]).length}/5</b></div>
      </div>
      ${status==="stuck"?`<div class="checkin-flag">⏸ No activity for ~${stuckMin} min — consider a check-in</div>`:""}
    </div>`;
  }).join("");
  return `<div class="section-title">Live Team Status — tap a card for details</div><div class="team-grid">${cards}</div>`;
}

function wallPacing(){
  const total=30;
  const segs = PACING.map(seg=>{
    const w = (seg.to-seg.from)/total*100;
    return `<div class="pacing-seg" style="width:${w}%; left:${seg.from/total*100}%;">${seg.icon}<br>${seg.label}<br>${seg.from}-${seg.to}m</div>`;
  }).join("");
  let nowPct=0;
  if(S.meta.sessionStart) nowPct = Math.min(100, (Date.now()-S.meta.sessionStart)/60000/total*100);
  return `<div class="pacing-wrap">
    <div class="section-title">Suggested Lesson Pacing (30 minutes)</div>
    <div class="pacing-track">${segs}${S.meta.sessionStart?`<div class="pacing-now" style="left:${nowPct}%;"></div>`:""}</div>
    <p style="color:var(--muted); font-size:13px; margin-top:26px;">${S.meta.sessionStart?"The marker shows where the class should be right now if following the suggested pace. Individual teams may naturally move faster or slower — use it as a guide, not a rule.":"The pacing marker will appear once you start the lesson."}</p>
  </div>`;
}

function wallAnswerKey(){
  const sections = ANSWER_KEY.map(ch=>{
    const items = ch.items.map(it=>`<div class="key-item">
      <p class="key-q">${it.q}</p>
      <p class="key-a">✅ ${it.a}</p>
      ${it.note?`<p class="key-note">${it.note}</p>`:""}
    </div>`).join("");
    return `<div class="key-ch"><h3>${ch.title}</h3><div class="kc-code">Override digit: ${ch.code}</div>${items}</div>`;
  }).join("");
  return `<div class="key-wrap"><div class="section-title">Teacher-Only Answer Key</div><p style="color:var(--muted); font-size:13px; margin-bottom:20px;">Not shown to students. Use the notes for common misconceptions and marking guidance on structured questions.</p>${sections}</div>`;
}

function wallAnalytics(){
  const teams = getTeamsArray();
  const finished = teams.filter(t=>t.finished);
  const avgScore = teams.length ? Math.round(teams.reduce((s,t)=>s+(t.score||0),0)/teams.length) : 0;
  const completionRate = teams.length ? Math.round(finished.length/teams.length*100) : 0;
  const avgTime = finished.length ? Math.round(finished.reduce((s,t)=>{ const secs = t.finishedAt&&t.startedAt ? (t.finishedAt-t.startedAt)/1000 : 0; return s+secs; },0)/finished.length/60) : 0;

  // aggregate logs across teams
  const itemStats = {};
  teams.forEach(t=>(t.log||[]).forEach(l=>{
    if(!itemStats[l.id]) itemStats[l.id]={wrong:0, hint:0, total:0};
    itemStats[l.id].total++;
    if(l.attempts>1) itemStats[l.id].wrong += (l.attempts-1);
    if(l.hint) itemStats[l.id].hint++;
  }));
  let hardest = null, hardestCount=-1, mostHinted=null, hintCount=-1;
  Object.entries(itemStats).forEach(([id,st])=>{
    if(st.wrong>hardestCount){ hardestCount=st.wrong; hardest=id; }
    if(st.hint>hintCount){ hintCount=st.hint; mostHinted=id; }
  });

  // concept breakdown by challenge (using progress reached as proxy for exposure + score density)
  const conceptNames = CH_NAMES;
  const conceptRows = conceptNames.map((name,i)=>{
    const reached = teams.filter(t=>t.chIndex>i || (t.chIndex===i) || t.finished).length;
    const pct = teams.length ? Math.round(reached/teams.length*100) : 0;
    const color = pct>=70?"var(--lime)":pct>=40?"var(--amber)":"var(--coral)";
    return `<div class="concept-bar-row"><div class="concept-label">${name}</div><div class="concept-track"><div class="concept-fill" style="width:${pct}%; background:${color};"></div></div><div class="mono" style="width:44px; text-align:right; font-size:12px;">${pct}%</div></div>`;
  }).join("");

  return `<div class="analytics-wrap">
    <div class="section-title">End-of-Lesson Analytics ${finished.length===0 && teams.length>0 ? "(live — updates as teams finish)":""}</div>
    <div class="stat-grid">
      <div class="stat-box"><div class="num">${avgScore}</div><div class="lbl">Avg. Score</div></div>
      <div class="stat-box"><div class="num">${completionRate}%</div><div class="lbl">Completion Rate</div></div>
      <div class="stat-box"><div class="num">${avgTime||"—"}</div><div class="lbl">Avg. Min. Taken</div></div>
      <div class="stat-box"><div class="num">${teams.length}</div><div class="lbl">Teams</div></div>
    </div>
    <div class="section-title">Reached / Completed by Concept</div>
    <div style="background:var(--panel-raised); border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:30px;">${teams.length? conceptRows : `<p style="color:var(--muted); font-size:13px;">No team data yet.</p>`}</div>
    <div class="section-title">Where students struggled</div>
    <div style="background:var(--panel-raised); border:1px solid var(--line); border-radius:16px; padding:22px; font-size:13.5px; color:var(--paper); line-height:1.8;">
      ${hardest? `Most re-attempted question: <b class="mono" style="color:var(--coral)">${hardest}</b> (${hardestCount} wrong attempts across teams). ` : "No attempt data yet. "}
      ${mostHinted? `Most-hinted question: <b class="mono" style="color:var(--amber)">${mostHinted}</b> (used by ${hintCount} team-attempts). ` : ""}
      <br><span style="color:var(--muted);">Cross-check these question IDs against the Answer Key tab to plan what to re-teach.</span>
    </div>
  </div>`;
}

/* ---------------- drawer ---------------- */
function bindWallEvents(){
  document.querySelectorAll("[data-teamidx]").forEach(c=>{
    c.onclick=()=>{ openDrawer(+c.dataset.teamidx); };
  });
}
function openDrawer(idx){
  const t = getTeamsArray()[idx];
  const overlay=document.getElementById("drawer-overlay"), drawer=document.getElementById("drawer");
  const logs = (t.log||[]).slice().reverse().map(l=>`<div class="log-row"><span>${l.id}</span><span class="tag ${l.correct?'tag-ok':'tag-bad'}">${l.correct?'✓ correct':'attempted'}</span></div>`).join("") || `<p style="color:var(--muted); font-size:13px;">No attempts logged yet.</p>`;
  drawer.innerHTML = `<button class="drawer-close" id="drawer-close">✕</button>
    <div class="eyebrow" style="color:var(--cyan);">Team Detail</div>
    <h2 style="margin:0 0 4px;">${t.teamName||"Unnamed Team"}</h2>
    <p style="color:var(--muted); font-size:13px; margin-bottom:20px;">${(t.students||[]).filter(Boolean).join(" · ")||"—"}</p>
    <div class="stat-grid" style="margin-bottom:24px;">
      <div class="stat-box"><div class="num">${t.progressPercent||0}%</div><div class="lbl">Progress</div></div>
      <div class="stat-box"><div class="num">${t.score||0}</div><div class="lbl">Score</div></div>
      <div class="stat-box"><div class="num">${t.hintsUsed||0}</div><div class="lbl">Hints</div></div>
    </div>
    <div class="section-title">Current status</div>
    <p style="font-size:14px; margin-bottom:18px;">${t.finished? "Escaped the lab! 🎉" : `On ${t.currentChallengeTitle||"—"}, item ${(t.itemIndex||0)+1}`}</p>
    <div class="section-title">Recent activity log</div>
    <div>${logs}</div>`;
  overlay.style.display="block"; drawer.style.display="block";
  overlay.onclick=closeDrawer;
  document.getElementById("drawer-close").onclick=closeDrawer;
}
function closeDrawer(){ document.getElementById("drawer-overlay").style.display="none"; document.getElementById("drawer").style.display="none"; }

/* ---------------- demo mode ---------------- */
function launchDemo(){
  S.demo=true; S.sessionCode="DEMO"; S.meta={sessionStart:Date.now()-4*60000};
  const names=["Team Alpha","Team Beta","Team Gamma","Team Delta","Team Epsilon"];
  S.demoTeams = names.map((n,i)=>({
    teamName:n, students:["Student "+(i*5+1),"Student "+(i*5+2),"Student "+(i*5+3),"Student "+(i*5+4),"Student "+(i*5+5)],
    chIndex:Math.floor(Math.random()*3), itemIndex:Math.floor(Math.random()*2), score:Math.floor(Math.random()*40),
    hintsUsed:Math.floor(Math.random()*3), codes:[], progressPercent:Math.floor(Math.random()*40),
    lastActivity: Date.now()-Math.floor(Math.random()*60000), finished:false, log:[], startedAt:Date.now()-4*60000
  }));
  S.demoTeams[4].lastActivity = Date.now()-6*60000; // force one "stuck"
  S.screen="wall"; S.activeTab="wall"; render();
  clearInterval(demoTimer);
  demoTimer=setInterval(()=>{
    S.demoTeams.forEach((t,i)=>{
      if(t.finished) return;
      if(i===4) return; // keep the stuck team stuck for demo purposes
      if(Math.random()<0.5){
        t.itemIndex++;
        t.score += 8; t.progressPercent = Math.min(100, t.progressPercent + Math.floor(100/TOTAL_ITEMS));
        t.lastActivity = Date.now();
        t.log = (t.log||[]).concat([{id:"demo_q"+Math.floor(Math.random()*20), type:"mcq", correct:Math.random()>0.3, attempts:1, hint:Math.random()>0.7, ts:Date.now()}]);
        if(t.chIndex < CH_NAMES.length-1 && t.itemIndex>=CH_ITEM_COUNTS[t.chIndex]){ t.chIndex++; t.itemIndex=0; t.codes.push("x"); }
        t.currentChallengeTitle = "Challenge "+(t.chIndex+1)+" · "+CH_NAMES[t.chIndex];
        if(t.progressPercent>=100){ t.finished=true; t.finishedAt=Date.now(); }
      }
    });
    if(S.screen==="wall" && S.activeTab==="wall") renderWallBody();
    updateTopbar();
  }, 3500);
}
function exitDemo(){
  clearInterval(demoTimer); S.demo=false; S.demoTeams=[]; S.sessionCode=""; S.meta={sessionStart:null};
  S.screen="setup"; render();
}

/* ---------------- timers ---------------- */
function startPolling(){ clearInterval(pollTimer); pollTimer=setInterval(pollAll, 4000); pollAll(); }
function startTicker(){ clearInterval(tickTimer); tickTimer=setInterval(updateTopbar, 1000); }
window.__initTeacherApp = function(){ render(); };

})();
</script>
<script>
/* ============================================================================
   SYNC — replaces Claude's window.storage entirely. Zero Claude dependency.

   Two modes:
   - "firebase": real cross-device sync via a free Firebase Realtime Database.
     No file editing needed — the teacher pastes their database URL into a
     field in the app itself (Team Setup screen), and the app automatically
     builds a shareable join LINK that carries that URL as a query parameter.
     Any student who opens that exact link is configured automatically —
     nothing to type, nothing to install.
   - "local": zero-setup fallback used automatically whenever no Firebase URL
     is configured (via the UI field or the link). Progress is saved in this
     browser only (survives refresh) but does not sync to other devices.
   ============================================================================ */
function readQueryParam(name){
  try{ return new URLSearchParams(location.search).get(name); }catch(e){ return null; }
}
var SYNC = (function(){
  var base = "";

  function keyToPath(key){ return key.split(":").map(encodeURIComponent).join("/"); }

  var firebaseBackend = {
    async set(key, value){
      var res = await fetch(base + "/" + keyToPath(key) + ".json", { method:"PUT", body: JSON.stringify(value) });
      if(!res.ok) throw new Error("sync set failed (" + res.status + ")");
      return { key:key, value:value };
    },
    async get(key){
      var res = await fetch(base + "/" + keyToPath(key) + ".json");
      if(!res.ok) throw new Error("sync get failed (" + res.status + ")");
      var data = await res.json();
      if(data === null || data === undefined) throw new Error("not found: " + key);
      return { key:key, value:data };
    },
    async delete(key){
      var res = await fetch(base + "/" + keyToPath(key) + ".json", { method:"DELETE" });
      if(!res.ok) throw new Error("sync delete failed (" + res.status + ")");
      return { key:key, deleted:true };
    },
    async list(prefix){
      var trimmed = prefix.replace(/:$/, "");
      var res = await fetch(base + "/" + keyToPath(trimmed) + ".json");
      if(!res.ok) throw new Error("sync list failed (" + res.status + ")");
      var data = await res.json();
      var keys = data ? Object.keys(data).map(function(k){ return prefix + decodeURIComponent(k); }) : [];
      return { keys:keys };
    }
  };

  var LOCAL_PREFIX = "biolab::";
  var localBackend = {
    async set(key, value){
      localStorage.setItem(LOCAL_PREFIX + key, JSON.stringify(value));
      return { key:key, value:value };
    },
    async get(key){
      var raw = localStorage.getItem(LOCAL_PREFIX + key);
      if(raw === null) throw new Error("not found: " + key);
      return { key:key, value: JSON.parse(raw) };
    },
    async delete(key){
      localStorage.removeItem(LOCAL_PREFIX + key);
      return { key:key, deleted:true };
    },
    async list(prefix){
      var keys = [];
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf(LOCAL_PREFIX + prefix) === 0) keys.push(k.slice(LOCAL_PREFIX.length));
      }
      return { keys:keys };
    }
  };

  var mode = "local";
  function applyConfig(firebaseUrl){
    var cleaned = (firebaseUrl || "").trim().replace(/\/$/, "");
    if(cleaned){ base = cleaned; mode = "firebase"; }
    else { base = ""; mode = "local"; }
  }

  // Auto-configure from the shared link (?fb=...) if present, else from anything
  // remembered locally from a previous session on this device.
  var fromUrl = readQueryParam("fb");
  var remembered = null;
  try{ remembered = localStorage.getItem("biolab-firebase-url"); }catch(e){}
  applyConfig(fromUrl || remembered || "");
  if(fromUrl){ try{ localStorage.setItem("biolab-firebase-url", fromUrl); }catch(e){} }

  return {
    get mode(){ return mode; },
    configure: function(firebaseUrl){
      applyConfig(firebaseUrl);
      try{
        if(mode === "firebase") localStorage.setItem("biolab-firebase-url", firebaseUrl.trim());
        else localStorage.removeItem("biolab-firebase-url");
      }catch(e){}
    },
    currentUrl: function(){ return base; },
    set: function(key, value){ return (mode==="firebase"?firebaseBackend:localBackend).set(key, value); },
    get: function(key){ return (mode==="firebase"?firebaseBackend:localBackend).get(key); },
    delete: function(key){ return (mode==="firebase"?firebaseBackend:localBackend).delete(key); },
    list: function(prefix){ return (mode==="firebase"?firebaseBackend:localBackend).list(prefix); }
  };
})();

(function(){
  function showRole(role){
    document.getElementById("roleSelect").style.display = "none";
    document.getElementById("studentRoot").style.display = role==="student" ? "block" : "none";
    document.getElementById("teacherRoot").style.display = role==="teacher" ? "block" : "none";
    document.getElementById("role-switch-link").style.display = "block";
    if(role==="student" && window.__initStudentApp) window.__initStudentApp();
    if(role==="teacher" && window.__initTeacherApp) window.__initTeacherApp();
  }
  document.getElementById("btn-role-student").onclick = function(){ showRole("student"); };
  document.getElementById("btn-role-teacher").onclick = function(){ showRole("teacher"); };
  document.getElementById("role-switch-link").onclick = function(e){
    e.preventDefault();
    if(!confirm("Switch role? This will reload the page and lose any unsaved local state (your team's saved progress on the server is safe).")) return;
    location.reload();
  };

  // If opened via a shared join link (?role=student&code=XXXX[&fb=...]), skip straight in.
  var urlRole = readQueryParam("role");
  var urlCode = readQueryParam("code");
  if(urlRole === "student" || urlRole === "teacher"){
    showRole(urlRole);
    if(urlRole === "student" && urlCode){
      setTimeout(function(){
        var codeInput = document.getElementById("in-code");
        if(codeInput) codeInput.value = urlCode.toUpperCase();
      }, 50);
    }
  }
})();

/* ============ sync health check — zero Claude dependency ============
   Tells you plainly which mode you're in: LOCAL (works instantly, no setup, this
   device only) or FIREBASE (real cross-device sync). If Firebase is configured but
   unreachable, explains why instead of failing silently. Practice Solo / Demo Mode
   always work regardless of this check. */
(function(){
  function showBanner(kind, html){
    var b = document.getElementById("storageWarningBanner");
    if(!b) return;
    b.className = kind;
    b.innerHTML = '<button class="swb-close" aria-label="Dismiss">✕</button>' + html;
    b.style.display = "block";
    var closeBtn = b.querySelector(".swb-close");
    if(closeBtn) closeBtn.onclick = function(){ b.style.display = "none"; };
  }
  async function checkSyncHealth(){
    if(SYNC.mode === "local"){
      showBanner("swb-info", "<b>ℹ️ Local-only mode.</b> This works instantly with zero setup, but each device tracks its own progress — the teacher view won't see student devices unless they're the same browser. For real cross-device sync, open the <b>teacher</b> view and enter a free Firebase database URL on the setup screen — no file editing needed. Practice Solo and Demo Mode always work fine either way.");
      return;
    }
    try{
      var testKey = "__healthcheck__" + Date.now();
      await SYNC.set(testKey, "ok");
      var r = await SYNC.get(testKey);
      try{ await SYNC.delete(testKey); }catch(e2){}
      if(!r || r.value !== "ok") throw new Error("unexpected response");
    }catch(e){
      showBanner("swb-warn", "<b>⚠ Live sync unavailable.</b> Couldn't reach your Firebase database (" + (e && e.message ? e.message : "unknown error") + "). Double-check <code>FIREBASE_DB_URL</code> is correct and that your Realtime Database rules allow read/write. Practice Solo and Demo Mode still work fine without this.");
    }
  }
  setTimeout(checkSyncHealth, 300);
})();
</script>
